<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Odeesh Odeesh — Vertex Mechanical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#14161F;
    --navy2:#1B1F2E;
    --teal:#12A6B0;
    --teal-dark:#0C7C84;
    --off:#F3F4F6;
    --grey:#8E96A6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background: radial-gradient(120% 90% at 15% 0%, #232838 0%, var(--navy) 55%, #0d0e15 100%);
    font-family:'Barlow Condensed', sans-serif;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:32px 16px 60px;
    color:#fff;
  }
  .card{
    width:100%;
    max-width:420px;
    position:relative;
  }
  .wedge{
    position:absolute;
    top:-32px; left:-16px;
    width:140px; height:140px;
    background:linear-gradient(135deg, var(--teal) 0%, transparent 70%);
    opacity:.5;
    clip-path:polygon(0 0, 100% 0, 0 100%);
    pointer-events:none;
    z-index:0;
  }
  .header{
    position:relative;
    z-index:1;
    text-align:center;
    padding:36px 20px 22px;
  }
  .logo{ width:220px; max-width:70%; margin:0 auto 18px; display:block; }
  .name{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    font-size:26px;
    letter-spacing:1px;
    margin:0;
  }
  .title{
    color:var(--teal);
    font-size:18px;
    letter-spacing:4px;
    text-transform:uppercase;
    margin:4px 0 0;
    font-weight:500;
  }
  .badge{
    margin-top:14px;
    display:inline-block;
    font-size:14px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--grey);
    border-top:1px solid #2a2f42;
    padding-top:12px;
  }
  .actions{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:12px;
    padding:6px 20px 0;
  }
  a.btn, button.btn{
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    text-align:left;
    padding:14px 18px;
    border-radius:12px;
    background:#1E2233;
    border:1px solid #2a2f42;
    color:#fff;
    text-decoration:none;
    font-family:'Barlow Condensed', sans-serif;
    font-size:19px;
    font-weight:600;
    letter-spacing:.5px;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease, border-color .12s ease;
  }
  a.btn:active, button.btn:active{ transform:scale(0.98); }
  a.btn:hover, button.btn:hover{ background:#242942; border-color:var(--teal-dark); }
  .btn .icon{
    width:38px; height:38px;
    min-width:38px;
    border-radius:9px;
    background:var(--teal);
    display:flex; align-items:center; justify-content:center;
  }
  .btn.primary{
    background:var(--teal);
    border-color:var(--teal);
  }
  .btn.primary .icon{ background:rgba(255,255,255,.22); }
  .btn.primary:hover{ background:var(--teal-dark); }
  .sub{ font-size:13px; color:var(--grey); font-weight:400; margin-top:1px; }
  .btn.primary .sub{ color:rgba(255,255,255,.8); }

  footer{
    position:relative; z-index:1;
    text-align:center;
    padding:26px 20px 0;
    font-size:14px;
    letter-spacing:1.5px;
    color:var(--grey);
    text-transform:uppercase;
  }
  footer span{ color:var(--teal); }
</style>
</head>
