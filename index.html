<title>Vertex Mechanical — Maintenance</title>
<style>
  :root{
    --bg:#0a0d13;
    --bg-soft:#12161f;
    --line:rgba(255,255,255,.09);
    --text:#f2f4f7;
    --muted:#8b93a3;
    --teal:#22c9df;
    --teal-dim:rgba(34,201,223,.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  .stage{
    position:relative;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    padding:64px 20px;
    background:
      radial-gradient(760px 520px at 50% 8%, rgba(34,201,223,.10), transparent 60%),
      radial-gradient(900px 700px at 90% 100%, rgba(34,201,223,.06), transparent 55%),
      var(--bg);
  }

  /* faint blueprint grid, on-brand for a mechanical contractor */
  .grid{
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(34,201,223,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(34,201,223,.05) 1px, transparent 1px);
    background-size:56px 56px;
    -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
    mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 75%);
  }

  .gear{
    position:absolute;
    color:var(--teal);
    opacity:.07;
    pointer-events:none;
  }
  .gear-a{ width:560px; height:560px; right:-160px; top:-180px; animation:spin 90s linear infinite; }
  .gear-b{ width:360px; height:360px; left:-120px; bottom:-140px; animation:spin-rev 70s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes spin-rev{ to{ transform:rotate(-360deg); } }
  @media (prefers-reduced-motion:reduce){
    .gear-a,.gear-b{ animation:none; }
  }

  .content{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:640px;
    width:100%;
  }

  .logo{ width:min(300px, 70vw); height:auto; margin-bottom:40px; }

  .badge{
    display:inline-flex;
    align-items:center;
    gap:10px;
    padding:9px 18px 9px 14px;
    border-radius:40px;
    background:var(--bg-soft);
    border:1px solid var(--line);
    margin-bottom:30px;
  }
  .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--teal);
    box-shadow:0 0 0 0 rgba(34,201,223,.55);
    animation:pulse 2.2s ease-out infinite;
  }
  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(34,201,223,.55); }
    70%{ box-shadow:0 0 0 9px rgba(34,201,223,0); }
    100%{ box-shadow:0 0 0 0 rgba(34,201,223,0); }
  }
  @media (prefers-reduced-motion:reduce){ .dot{ animation:none; } }
  .badge span{
    font-family:'Oswald',ui-sans-serif,system-ui,sans-serif;
    font-size:12px; font-weight:600; letter-spacing:.14em; text-transform:uppercase;
    color:var(--teal);
  }

  h1{
    font-family:'Oswald',ui-sans-serif,system-ui,sans-serif;
    font-weight:600;
    font-size:clamp(30px, 5.4vw, 46px);
    line-height:1.12;
    letter-spacing:.01em;
    text-transform:uppercase;
    margin:0 0 18px;
    text-wrap:balance;
  }
  h1 em{ color:var(--teal); font-style:normal; }

  p.lede{
    margin:0 0 40px;
    color:var(--muted);
    font-size:16.5px;
    line-height:1.65;
    max-width:480px;
    text-wrap:balance;
  }

  .divider{
    width:64px; height:1px; background:var(--line); margin:0 0 32px;
  }

  .contact{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px;
    font-size:14.5px; color:var(--muted); margin-bottom:56px;
  }
  .contact a{
    color:var(--text); font-weight:600; text-decoration:none; border-bottom:1px solid var(--teal-dim);
  }
  .contact a:hover{ border-bottom-color:var(--teal); }

  footer{
    font-size:12px;
    letter-spacing:.04em;
    color:#565f6f;
  }

  @media (max-width:480px){
    .stage{ padding:48px 20px; }
    .logo{ margin-bottom:32px; }
    p.lede{ font-size:15.5px; }
  }
</style>
